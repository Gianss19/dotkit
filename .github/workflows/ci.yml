name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build dotkit.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/dotkit.Tests.csproj -c Release --no-restore

      - name: Audit NuGet vulnerabilities
        run: |
          dotnet list dotkit.csproj package --vulnerable --include-transitive
          dotnet list tests/dotkit.Tests.csproj package --vulnerable --include-transitive

      - name: Pack
        run: dotnet pack dotkit.csproj -c Release --no-build -o artifacts

      - name: Upload nupkg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nupkg
          path: artifacts/dotkit.*.nupkg
          if-no-files-found: error

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nupkg
          path: artifacts

      - name: Run end-to-end smoke test
        run: bash ./scripts/e2e.sh
        shell: bash
